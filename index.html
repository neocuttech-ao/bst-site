<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stran v pripravi</title>
<meta name="description" content="Svetovanje za proizvodna podjetja: organizacija, podatkovna arhitektura, avtomatizacija, vodenje na izposojo.">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #1a1a1a;
    --muted: #5f5b55;
    --line: #e3dfd8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --fg: #f2efea; --muted: #a39d94; --line: #2b2b2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    display: grid; place-items: center; min-height: 100svh; padding: 48px 16px;
  }
  main { max-width: 34rem; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.15; margin: 0 0 1rem; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 1rem; }
  ul { color: var(--muted); padding-left: 1.1rem; margin: 0 0 1.75rem; }
  li { margin-bottom: .35rem; }
  footer { border-top: 1px solid var(--line); padding-top: 1rem; font-size: .9rem; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Stran je v pripravi</h1>
  <p>Svetovanje za proizvodna in storitvena podjetja v Sloveniji:</p>
  <ul>
    <li>reševanje problemov v proizvodnji</li>
    <li>optimizacija organizacijske strukture</li>
    <li>postavitev podatkovne arhitekture</li>
    <li>avtomatizacija in digitalizacija</li>
    <li>vodenje na izposojo (C-level outsourcing)</li>
  </ul>
  <footer>Vsebina sledi.</footer>
</main>
</body>
</html>
